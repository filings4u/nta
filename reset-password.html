<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b356c"><title>Reset Password | NTA Logistics</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/images/favicon.ico" sizes="any"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/admin.css"><style>.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:18px;color:#40546d}</style></head><body class="nta-admin"><div class="admin-auth"><div class="auth-card"><div class="auth-head"><img src="assets/images/nta-logistics-logo4.png" alt="NTA Logistics"><h1>Reset Password</h1><p>Create a new password for your NTA management account.</p></div><div class="auth-body"><form id="resetForm"><div class="field"><label for="password">New password</label><div class="password-field"><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false"><span aria-hidden="true">👁</span></button></div></div><div class="field" style="margin-top:14px"><label for="confirmPassword">Confirm new password</label><div class="password-field"><input id="confirmPassword" type="password" name="confirmPassword" minlength="10" required autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false"><span aria-hidden="true">👁</span></button></div></div><button id="submitBtn" class="btn btn-gold" style="width:100%;margin-top:16px">Update Password</button></form><div id="status" class="status" aria-live="polite"></div><div style="text-align:center;margin-top:18px"><a href="admin.html" style="font-weight:800;color:#0754b8;text-decoration:none">Back to admin sign in</a></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/nta-supabase.js"></script><script>(async()=>{const cfg=window.NTA_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById('resetForm'),status=document.getElementById('status'),button=document.getElementById('submitBtn');document.querySelectorAll('[data-password-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.passwordToggle);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'Hide password':'Show password')}));function show(message,type=''){status.textContent=message;status.className='status'+(type?' '+type:'')}let recoveryReady=false;sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)recoveryReady=true});const {data}=await sb.auth.getSession();if(data?.session)recoveryReady=true;form.addEventListener('submit',async(event)=>{event.preventDefault();const fd=new FormData(form),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirmPassword')||'');if(password.length<10){show('Use a password with at least 10 characters.','error');return}if(password!==confirmPassword){show('The passwords do not match.','error');return}if(!recoveryReady){show('This password reset link is invalid or expired. Request a new reset link.','error');return}button.disabled=true;button.textContent='Updating…';const {error}=await sb.auth.updateUser({password});button.disabled=false;button.textContent='Update Password';if(error){show(error.message,'error');return}show('Password updated. Redirecting to admin sign in…','success');await sb.auth.signOut();setTimeout(()=>{window.location.href=cfg.adminUrl},900)})})();</script></body></html>
