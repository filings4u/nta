<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b356c"><title>Reset Password | NTA Logistics</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/images/favicon.ico" sizes="any"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body class="nta-admin"><div class="admin-auth"><div class="auth-card"><div class="auth-head"><img src="assets/images/nta-logistics-logo4.png" alt="NTA Logistics"><h1>Reset Password</h1><p>Create a new password for your NTA management account.</p></div><div class="auth-body"><form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password"></div><div class="field" style="margin-top:14px"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="10" required autocomplete="new-password"></div><button id="submitBtn" class="btn btn-gold" style="width:100%;margin-top:16px">Update Password</button></form><div id="status" class="status" aria-live="polite"></div><div style="text-align:center;margin-top:18px"><a href="admin.html" style="font-weight:800;color:#0754b8;text-decoration:none">Back to admin sign in</a></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/nta-supabase.js"></script><script>(async()=>{const cfg=window.NTA_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById('resetForm'),status=document.getElementById('status'),button=document.getElementById('submitBtn');function show(message,type=''){status.textContent=message;status.className='status'+(type?' '+type:'')}let recoveryReady=false;sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)recoveryReady=true});const {data}=await sb.auth.getSession();if(data?.session)recoveryReady=true;form.addEventListener('submit',async(event)=>{event.preventDefault();const fd=new FormData(form),password=String(fd.get('password')||''),confirmPassword=String(fd.get('confirmPassword')||'');if(password.length<10){show('Use a password with at least 10 characters.','error');return}if(password!==confirmPassword){show('The passwords do not match.','error');return}if(!recoveryReady){show('This password reset link is invalid or expired. Request a new reset link.','error');return}button.disabled=true;button.textContent='Updating…';const {error}=await sb.auth.updateUser({password});button.disabled=false;button.textContent='Update Password';if(error){show(error.message,'error');return}show('Password updated. Redirecting to admin sign in…','success');await sb.auth.signOut();setTimeout(()=>{window.location.href=cfg.adminUrl},900)})})();</script></body></html>
