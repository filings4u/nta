<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b356c"><title>Forgot Password | NTA Logistics</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/images/favicon.ico" sizes="any"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/admin.css"></head><body class="nta-admin"><div class="admin-auth"><div class="auth-card"><div class="auth-head"><img src="assets/images/nta-logistics-logo4.png" alt="NTA Logistics"><h1>Forgot Password</h1><p>Enter your NTA admin email and we’ll send a secure password reset link.</p></div><div class="auth-body"><form id="forgotForm"><div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email"></div><button id="submitBtn" class="btn btn-gold" style="width:100%;margin-top:16px">Send Reset Link</button></form><div id="status" class="status" aria-live="polite"></div><div style="text-align:center;margin-top:18px"><a href="admin.html" style="font-weight:800;color:#0754b8;text-decoration:none">Back to admin sign in</a></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/nta-supabase.js"></script><script>(()=>{const cfg=window.NTA_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById('forgotForm'),status=document.getElementById('status'),button=document.getElementById('submitBtn');function show(message,type=''){status.textContent=message;status.className='status'+(type?' '+type:'')}form.addEventListener('submit',async(event)=>{event.preventDefault();const email=String(new FormData(form).get('email')||'').trim();if(!email)return;button.disabled=true;button.textContent='Sending…';show('');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:cfg.resetPasswordUrl});button.disabled=false;button.textContent='Send Reset Link';if(error){show(error.message,'error');return}show('If an NTA admin account exists for that email, a password reset link has been sent. Check your inbox.','success')})})();</script></body></html>
